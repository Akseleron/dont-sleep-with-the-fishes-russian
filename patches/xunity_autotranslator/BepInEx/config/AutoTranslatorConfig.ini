[Service]
; Empty endpoint keeps this package manual/offline. Set explicitly if machine translation is wanted.
Endpoint=
FallbackEndpoint=

[General]
Language=ru
FromLanguage=en

[Files]
Directory=Translation\{Lang}\Text
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt
SubstitutionFile=Translation\{Lang}\Text\_Substitutions.txt
PreprocessorsFile=Translation\{Lang}\Text\_Preprocessors.txt
PostprocessorsFile=Translation\{Lang}\Text\_Postprocessors.txt

[TextFrameworks]
EnableUGUI=True
EnableUIElements=True
EnableNGUI=True
EnableTextMeshPro=True
EnableTextMesh=False
EnableIMGUI=False

[Behaviour]
MaxCharactersPerTranslation=400
IgnoreWhitespaceInDialogue=True
IgnoreWhitespaceInNGUI=True
MinDialogueChars=20
EnableUIResizing=True
ForceUIResizing=True
EnableBatching=True
UseStaticTranslations=False
OverrideFont=
; Preferred TMP font fix if Russian glyphs render as boxes.
; Put a verified Cyrillic TMP font AssetBundle in the game root and set its filename here.
FallbackFontTextMeshPro=
OverrideFontTextMeshPro=
TranslationPostProcessing=ReplaceHtmlEntities
GeneratePartialTranslations=False
EnableTranslationScoping=False
EnableSilentMode=False
OutputUntranslatableText=False
IgnoreVirtualTextSetterCallingRules=False
HandleRichText=True
PersistRichTextMode=Final

[Texture]
EnableTextureTranslation=False
EnableTextureDumping=False
EnableTextureToggling=False
EnableTextureScanOnSceneLoad=False

[ResourceRedirector]
EnableTextAssetRedirector=False
LogAllLoadedResources=False
EnableDumping=False
